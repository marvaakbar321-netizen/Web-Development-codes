<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task Implementation</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        /* HEADER */

        header {
            height: 80px;
            background: #222;
            color: white;

            display: flex;
            /* FLEX USED */
            justify-content: center;
            align-items: center;

            font-size: 24px;
        }

        /* MAIN AREA USING calc() */

        main {
            height: calc(100vh - 80px);
            /* calc() example */
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #333;
            color: white;
            padding: 20px;
        }

        /* CONTENT AREA */

        .content {
            width: calc(100% - 250px);
            /* calc with width */
            padding: 20px;
        }

        /* GRID LAYOUT */

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        /* GRID ITEMS */

        .box {
            height: 150px;
            background: orange;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;

            /* ANIMATION */

            animation: rotateBox 4s linear infinite;
        }

        /* KEYFRAMES ROTATE */

        @keyframes rotateBox {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        /* SCALE ANIMATION */

        .scale-box {
            height: 150px;
            background: tomato;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            margin-top: 20px;

            animation: scaleBox 2s infinite;
        }

        @keyframes scaleBox {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }

        }

        /* MEDIA QUERY MOBILE */

        @media(max-width:600px) {

            main {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .content {
                width: 100%;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

        }

        /* MEDIA QUERY TABLET */

        @media(min-width:601px) and (max-width:1024px) {

            .grid-container {
                grid-template-columns: 1fr 1fr;
            }

        }

        /* DESKTOP */

        @media(min-width:1025px) {

            .grid-container {
                grid-template-columns: 1fr 1fr 1fr;
            }

        }
    </style>

</head>

<body>

    <header>
        My Responsive Website
    </header>

    <main>

        <!-- SIDEBAR -->

        <div class="sidebar">

            <h2>Menu</h2>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>

        </div>

        <!-- CONTENT -->

        <div class="content">

            <h2>Grid Layout Example</h2>

            <div class="grid-container">

                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
                <div class="box">6</div>

            </div>

            <h2>Scale Animation</h2>

            <div class="scale-box">
                Animation
            </div>

        </div>

    </main>
</body>
</html>
