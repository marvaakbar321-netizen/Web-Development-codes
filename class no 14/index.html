<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: red;
            transition: background-color 0.4s ease-in, font-size 0.4s ease-in-out;
        }
        button:hover{
            background-color: aqua;
            font-size: 40px;
        }
        .box{
            transition: transform ;
        }
    </style>
</head>
<body>
    <button>
        Hello Me
    </button>
    <div class="box">
        <h1>Hello</h1>
    </div>

</body>
</html>
