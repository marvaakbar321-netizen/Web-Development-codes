<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: rgb(69, 69, 252);
            height: 600px;
            width: 100%;
        }
        .container{
            background-color: black;
            width: 100%;
            height: 90px;
            color: white;
            padding: 10px;
            display: flex;
            border: 2px solid white;
        }
        .left{
            width: 280px;
            font-size: 30px;
            font-family: sans-serif;
        }
        .right{
            display: flex;
            gap: 170px;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="left">
                <h3>Company</h3>
            </div>
            <div class="right">
                <p>Home</p>
                <p>About</p>
                <p>Gallery</p>
                <p>Contact</p>
                <p>Others</p>
            </div>
        </div>
    </div>
</body>
</html>
